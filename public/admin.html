<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Register Application</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --fg: #09090b;
      --muted: #71717a;
      --muted-bg: #f4f4f5;
      --border: #e4e4e7;
      --input-bg: #ffffff;
      --ring: #18181b;
      --card-bg: #ffffff;
      --card-shadow: 0 1px 3px 0 rgb(0 0 0 / .1), 0 1px 2px -1px rgb(0 0 0 / .1);
      --radius: 0.5rem;
      --btn-bg: #18181b;
      --btn-fg: #fafafa;
      --btn-hover: #27272a;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #09090b;
        --fg: #fafafa;
        --muted: #a1a1aa;
        --muted-bg: #27272a;
        --border: #27272a;
        --input-bg: #09090b;
        --ring: #d4d4d8;
        --card-bg: #18181b;
        --card-shadow: 0 1px 3px 0 rgb(0 0 0 / .4), 0 1px 2px -1px rgb(0 0 0 / .4);
        --btn-bg: #fafafa;
        --btn-fg: #18181b;
        --btn-hover: #e4e4e7;
      }
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--fg);
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: calc(var(--radius) + 4px);
      box-shadow: var(--card-shadow);
      padding: 2rem;
    }

    .header {
      text-align: center;
      margin-bottom: 1.75rem;
    }

    h1 {
      font-size: 1.375rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.3;
    }

    .subtitle {
      font-size: 0.875rem;
      color: var(--muted);
      margin-top: 0.35rem;
    }

    .form { display: flex; flex-direction: column; gap: 1rem; }

    .field { display: flex; flex-direction: column; gap: 0.4rem; }

    label {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--fg);
    }

    input {
      width: 100%;
      height: 2.375rem;
      padding: 0 0.75rem;
      font-family: inherit;
      font-size: 0.875rem;
      color: var(--fg);
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    input:focus {
      border-color: var(--ring);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--ring) 20%, transparent);
    }

    button[type="submit"] {
      width: 100%;
      height: 2.375rem;
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--btn-fg);
      background: var(--btn-bg);
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      margin-top: 0.5rem;
      transition: background 0.15s;
    }

    button[type="submit"]:hover { background: var(--btn-hover); }

    .result {
      display: none;
      margin-top: 1.5rem;
      padding: 1rem;
      background: var(--muted-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      word-break: break-all;
    }

    .result h3 {
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .result-field {
      margin-bottom: 1rem;
    }

    .result-field label {
      display: block;
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 0.25rem;
    }

    .result-field code {
      display: block;
      padding: 0.5rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.875rem;
    }

    .error-msg {
      display: none;
      font-size: 0.8125rem;
      color: #ef4444;
      background: color-mix(in srgb, #ef4444 10%, transparent);
      border: 1px solid color-mix(in srgb, #ef4444 25%, transparent);
      border-radius: var(--radius);
      padding: 0.625rem 0.75rem;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h1>Register Application</h1>
      <p class="subtitle">Create a new application for OIDC authentication</p>
    </div>

    <div id="errorMsg" class="error-msg"></div>

    <form class="form" id="appForm">
      <div class="field">
        <label for="name">Application Display Name</label>
        <input id="name" name="name" type="text" placeholder="My Awesome App" required />
      </div>

      <div class="field">
        <label for="url">Application URL</label>
        <input id="url" name="url" type="url" placeholder="https://myapp.com" required />
      </div>

      <div class="field">
        <label for="redirectUri">Redirect URI</label>
        <input id="redirectUri" name="redirectUri" type="url" placeholder="https://myapp.com/callback" required />
      </div>

      <button type="submit">Register Application</button>
    </form>

    <div id="result" class="result">
      <h3>Application Created!</h3>
      <p class="subtitle" style="margin-bottom: 1rem;">Copy these credentials and store them safely.</p>
      
      <div class="result-field">
        <label>Client ID</label>
        <code id="clientId"></code>
      </div>

      <div class="result-field">
        <label>Client Secret</label>
        <code id="clientSecret"></code>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('appForm');
    const resultDiv = document.getElementById('result');
    const errorMsg = document.getElementById('errorMsg');
    const clientIdCode = document.getElementById('clientId');
    const clientSecretCode = document.getElementById('clientSecret');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.style.display = 'none';
      resultDiv.style.display = 'none';

      const formData = new FormData(form);
      const payload = Object.fromEntries(formData.entries());

      try {
        const res = await fetch('/admin/application', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        const data = await res.json();

        if (!res.ok) {
          errorMsg.textContent = data.message || 'Error creating application';
          errorMsg.style.display = 'block';
        } else {
          clientIdCode.textContent = data.client_id;
          clientSecretCode.textContent = data.client_secret;
          resultDiv.style.display = 'block';
          form.reset();
        }
      } catch (err) {
        errorMsg.textContent = 'Network error';
        errorMsg.style.display = 'block';
      }
    });
  </script>
</body>
</html>
